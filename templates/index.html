<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tabela de Ativos</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:             #08080e;
    --card:           #0f0f18;
    --card2:          #13131f;
    --border:         rgba(255,255,255,0.06);
    --border2:        rgba(255,255,255,0.10);
    --accent-green:   #22c55e;
    --accent-purple:  #a855f7;
    --accent-blue:    #3b82f6;
    --accent-pink:    #ec4899;
    --accent-yellow:  #eab308;
    --accent-red:     #ef4444;
    --text:           #f1f5f9;
    --text-muted:     #4a5568;
    --text-mid:       #8892a4;
    --font:           'Sora', sans-serif;
    --mono:           'JetBrains Mono', monospace;
    --radius:         18px;
    --radius-sm:      11px;
    --radius-pill:    999px;
    --shadow-glow-purple: 0 0 40px rgba(168,85,247,0.12);
    --shadow-glow-blue: 0 0 40px rgba(59,130,246,0.10);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ─── LOADER ─────────────────────────────────────────── */
  #loader {
    position:fixed; inset:0; background:#08080e; z-index:9999;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:28px;
    transition:opacity 0.7s cubic-bezier(0.4,0,0.2,1), transform 0.7s cubic-bezier(0.4,0,0.2,1);
  }
  #loader.hide {
    opacity:0; pointer-events:none;
    transform:scale(1.04) translateY(-8px);
  }

  /* Loader logo pulse */
  .loader-logo {
    font-family: var(--font);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.15);
    animation: logoReveal 1.8s ease forwards;
  }
  @keyframes logoReveal {
    0%  { opacity:0; transform:translateY(6px); }
    30% { opacity:1; transform:translateY(0); }
    80% { opacity:1; }
    100%{ opacity:0.8; }
  }

  .loader-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:7px; }
  .loader-dot {
    width:5px; height:5px; border-radius:50%;
    background:rgba(255,255,255,0.06);
    animation:dotPulse 2s ease-in-out infinite;
  }
  .loader-dot:nth-child(1){animation-delay:0.00s}.loader-dot:nth-child(2){animation-delay:0.07s}
  .loader-dot:nth-child(3){animation-delay:0.14s}.loader-dot:nth-child(4){animation-delay:0.21s}
  .loader-dot:nth-child(5){animation-delay:0.28s}.loader-dot:nth-child(6){animation-delay:0.35s}
  .loader-dot:nth-child(7){animation-delay:0.42s}.loader-dot:nth-child(8){animation-delay:0.49s}
  .loader-dot:nth-child(9){animation-delay:0.56s}.loader-dot:nth-child(10){animation-delay:0.63s}
  .loader-dot:nth-child(11){animation-delay:0.70s}.loader-dot:nth-child(12){animation-delay:0.77s}
  .loader-dot:nth-child(13){animation-delay:0.84s}.loader-dot:nth-child(14){animation-delay:0.77s}
  .loader-dot:nth-child(15){animation-delay:0.70s}.loader-dot:nth-child(16){animation-delay:0.63s}
  .loader-dot:nth-child(17){animation-delay:0.56s}.loader-dot:nth-child(18){animation-delay:0.49s}
  .loader-dot:nth-child(19){animation-delay:0.42s}.loader-dot:nth-child(20){animation-delay:0.35s}
  .loader-dot:nth-child(21){animation-delay:0.28s}.loader-dot:nth-child(22){animation-delay:0.21s}
  .loader-dot:nth-child(23){animation-delay:0.14s}.loader-dot:nth-child(24){animation-delay:0.07s}
  .loader-dot:nth-child(25){animation-delay:0.00s}

  @keyframes dotPulse {
    0%,100%{background:rgba(255,255,255,0.05);transform:scale(1)}
    50%{background:rgba(168,85,247,0.85);transform:scale(1.7);box-shadow:0 0 10px rgba(168,85,247,0.5)}
  }

  .loader-bar-wrap {
    width:140px; height:1.5px;
    background:rgba(255,255,255,0.05);
    border-radius:999px; overflow:hidden;
  }
  .loader-bar {
    height:100%; width:0%;
    background:linear-gradient(90deg,#a855f7,#3b82f6,#22c55e);
    border-radius:999px;
    animation:barFill 1.7s cubic-bezier(.4,0,.2,1) forwards;
    box-shadow:0 0 8px rgba(168,85,247,0.5);
  }
  @keyframes barFill{0%{width:0%}55%{width:70%}85%{width:92%}100%{width:100%}}

  .loader-label {
    font-family:var(--mono);font-size:10px;
    letter-spacing:0.22em;color:rgba(255,255,255,0.15);
    text-transform:uppercase;
    animation:labelFade 1.7s ease forwards;
  }
  @keyframes labelFade{0%{opacity:0}25%{opacity:1}75%{opacity:1}100%{opacity:0}}
  body.loading { overflow:hidden; }

  /* ─── PAGE TRANSITION OVERLAY ─────────────────────────── */
  #page-transition {
    position:fixed; inset:0; z-index:8888;
    pointer-events:none;
    overflow:hidden;
  }

  /* Curtain wipe — two panels that slide in/out */
  .pt-curtain {
    position:absolute; inset:0;
    display:grid; grid-template-columns:1fr 1fr 1fr;
    gap:0;
  }
  .pt-stripe {
    background: linear-gradient(180deg, rgba(168,85,247,0.18) 0%, rgba(59,130,246,0.12) 100%);
    backdrop-filter:blur(0px);
    transform: translateY(-100%);
    transition: none;
  }
  .pt-stripe::after {
    content:'';
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(8,8,14,0.95) 0%, rgba(15,15,24,0.90) 100%);
  }

  /* Active state: curtains drop */
  #page-transition.dropping .pt-stripe {
    transform: translateY(0%);
  }
  #page-transition.dropping .pt-stripe:nth-child(1) { transition: transform 0.32s cubic-bezier(0.76,0,0.24,1) 0.00s; }
  #page-transition.dropping .pt-stripe:nth-child(2) { transition: transform 0.32s cubic-bezier(0.76,0,0.24,1) 0.04s; }
  #page-transition.dropping .pt-stripe:nth-child(3) { transition: transform 0.32s cubic-bezier(0.76,0,0.24,1) 0.08s; }

  /* Rising state: curtains go up */
  #page-transition.rising .pt-stripe {
    transform: translateY(-100%);
  }
  #page-transition.rising .pt-stripe:nth-child(1) { transition: transform 0.38s cubic-bezier(0.76,0,0.24,1) 0.08s; }
  #page-transition.rising .pt-stripe:nth-child(2) { transition: transform 0.38s cubic-bezier(0.76,0,0.24,1) 0.04s; }
  #page-transition.rising .pt-stripe:nth-child(3) { transition: transform 0.38s cubic-bezier(0.76,0,0.24,1) 0.00s; }

  /* ─── BODY ──────────────────────────────────────────── */
  body {
    background:var(--bg); color:var(--text); font-family:var(--font);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:0 20px 64px;
    background-image:
      radial-gradient(ellipse 55% 45% at 15% 0%, rgba(168,85,247,0.09) 0%, transparent 65%),
      radial-gradient(ellipse 45% 35% at 85% 5%, rgba(59,130,246,0.07) 0%, transparent 65%),
      radial-gradient(ellipse 30% 25% at 50% 100%, rgba(34,197,94,0.04) 0%, transparent 60%);
  }

  /* ─── HEADER ────────────────────────────────────────── */
  header {
    width:100%; max-width:1200px;
    padding:52px 0 40px;
    display:flex; flex-direction:column; align-items:flex-start; gap:14px;
    margin-bottom:12px;
    /* Entrance animation */
    animation: headerEntrance 0.8s cubic-bezier(0.22,1,0.36,1) 0.1s both;
  }
  @keyframes headerEntrance {
    from { opacity:0; transform:translateY(20px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .header-badge {
    display:inline-flex; align-items:center; gap:8px;
    padding:5px 14px; border-radius:var(--radius-pill);
    border:1px solid rgba(34,197,94,0.3);
    background:rgba(34,197,94,0.06);
    color:var(--accent-green); font-size:11px; font-weight:600;
    letter-spacing:0.06em; text-transform:uppercase;
    animation: badgePop 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.3s both;
  }
  @keyframes badgePop {
    from { opacity:0; transform:scale(0.8) translateY(4px); }
    to   { opacity:1; transform:none; }
  }
  .header-badge::before {
    content:''; width:6px; height:6px; border-radius:50%;
    background:var(--accent-green);
    box-shadow:0 0 10px var(--accent-green);
    animation:pulseDot 2.5s ease-in-out infinite;
  }
  @keyframes pulseDot {
    0%,100%{box-shadow:0 0 6px var(--accent-green);}
    50%{box-shadow:0 0 14px var(--accent-green), 0 0 24px rgba(34,197,94,0.3);}
  }

  .header-title {
    font-size:clamp(30px,5vw,44px); font-weight:800;
    letter-spacing:-0.035em; line-height:1.1; color:#fff;
    animation: titleEntrance 0.8s cubic-bezier(0.22,1,0.36,1) 0.15s both;
  }
  @keyframes titleEntrance {
    from { opacity:0; transform:translateY(14px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .header-sub {
    font-size:14px; color:var(--text-mid); font-weight:400;
    max-width:480px; line-height:1.65;
    animation: titleEntrance 0.8s cubic-bezier(0.22,1,0.36,1) 0.22s both;
  }

  /* ─── MAIN NAV TABS ─────────────────────────────────── */
  nav {
    display:flex; gap:5px;
    width:100%; max-width:1200px; margin-bottom:28px;
    background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius); padding:5px;
    position:relative;
    animation: navEntrance 0.8s cubic-bezier(0.22,1,0.36,1) 0.28s both;
    box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  }
  @keyframes navEntrance {
    from { opacity:0; transform:translateY(12px); }
    to   { opacity:1; transform:translateY(0); }
  }

  /* Sliding indicator */
  .nav-indicator {
    position:absolute;
    height:calc(100% - 10px);
    top:5px;
    background:rgba(255,255,255,0.07);
    border-radius: calc(var(--radius-sm) - 1px);
    box-shadow: 0 1px 4px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05);
    transition: left 0.35s cubic-bezier(0.34,1.3,0.64,1), width 0.35s cubic-bezier(0.34,1.3,0.64,1);
    pointer-events:none;
    z-index:0;
  }

  .tab {
    flex:1; padding:11px 16px; border-radius:var(--radius-sm); border:none;
    background:transparent; color:var(--text-muted); font-family:var(--font);
    font-size:14px; font-weight:600; cursor:pointer;
    transition: color 0.25s ease, transform 0.15s ease;
    letter-spacing:0.01em; position:relative; z-index:1;
  }
  .tab:hover { color:var(--text); transform:translateY(-0.5px); }
  .tab.active { color:#fff; }

  /* ─── PANELS ─────────────────────────────────────────── */
  .panel { display:none; width:100%; max-width:1200px; }
  .panel.active { display:block; }

  /* Panel transition states */
  .panel-enter {
    animation: panelIn 0.42s cubic-bezier(0.22,1,0.36,1) both;
  }
  .panel-exit {
    animation: panelOut 0.22s cubic-bezier(0.4,0,1,1) both;
  }

  @keyframes panelIn {
    from {
      opacity:0;
      transform: translateY(18px) scale(0.99);
      filter: blur(2px);
    }
    to {
      opacity:1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }
  }
  @keyframes panelOut {
    from { opacity:1; transform:translateY(0) scale(1); }
    to   { opacity:0; transform:translateY(-10px) scale(0.99); }
  }

  /* Staggered children */
  .panel.active .card:nth-child(1) { animation: cardStagger 0.5s cubic-bezier(0.22,1,0.36,1) 0.05s both; }
  .panel.active .card:nth-child(2) { animation: cardStagger 0.5s cubic-bezier(0.22,1,0.36,1) 0.10s both; }
  .panel.active .card:nth-child(3) { animation: cardStagger 0.5s cubic-bezier(0.22,1,0.36,1) 0.15s both; }
  @keyframes cardStagger {
    from { opacity:0; transform:translateY(16px); }
    to   { opacity:1; transform:translateY(0); }
  }

  /* ─── CARD ───────────────────────────────────────────── */
  .card {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius); padding:28px 32px; margin-bottom:16px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.25);
    position:relative; overflow:hidden;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .card::before {
    content:'';
    position:absolute; inset:0;
    background: radial-gradient(ellipse 80% 60% at 10% 0%, rgba(168,85,247,0.04) 0%, transparent 60%);
    pointer-events:none;
  }
  .card:hover {
    border-color:rgba(255,255,255,0.09);
    box-shadow: 0 4px 32px rgba(0,0,0,0.35);
  }

  /* ─── FORM ───────────────────────────────────────────── */
  .form-section { margin-bottom:28px; }
  .form-section-label {
    font-size:10px; font-weight:700; letter-spacing:0.18em;
    text-transform:uppercase; color:var(--text-muted);
    display:flex; align-items:center; gap:10px; margin-bottom:16px;
  }
  .form-section-label::after { content:''; flex:1; height:1px; background:var(--border); }
  .section-title {
    font-size:11px; font-weight:600; letter-spacing:0.12em;
    color:var(--text-muted); text-transform:uppercase; margin-bottom:24px;
  }
  .form-grid   { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .form-grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }
  .form-grid-4 { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:16px; }
  .form-group { display:flex; flex-direction:column; gap:7px; }
  .form-group.full { grid-column:1 / -1; }
  label { font-size:11px; font-weight:600; letter-spacing:0.06em; color:var(--text-muted); text-transform:uppercase; }

  select, input[type="text"] {
    background:rgba(255,255,255,0.03);
    border:1px solid var(--border2);
    border-radius:var(--radius-sm); color:var(--text); font-family:var(--mono);
    font-size:13.5px; padding:11px 16px; outline:none;
    transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease, transform 0.15s ease;
    width:100%;
  }
  select:hover, input[type="text"]:hover {
    border-color:rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.04);
  }
  select:focus, input[type="text"]:focus {
    border-color:rgba(168,85,247,0.55);
    background:rgba(168,85,247,0.06);
    box-shadow:0 0 0 3px rgba(168,85,247,0.12), 0 2px 8px rgba(0,0,0,0.2);
    transform: translateY(-1px);
  }
  select option { background:#0f0f18; }
  input::placeholder { color:var(--text-muted); }

  /* ─── BUTTONS ─────────────────────────────────────────── */
  .btn {
    padding:12px 28px; border-radius:var(--radius-sm); border:none;
    font-family:var(--font); font-size:14px; font-weight:700;
    cursor:pointer; letter-spacing:0.02em;
    transition: all 0.2s cubic-bezier(0.34,1.3,0.64,1);
    position:relative; overflow:hidden;
  }
  .btn::after {
    content:'';
    position:absolute; inset:0;
    background:rgba(255,255,255,0);
    transition: background 0.2s ease;
  }
  .btn:hover::after { background:rgba(255,255,255,0.06); }
  .btn:active { transform:scale(0.97) translateY(1px) !important; }

  .btn-primary {
    background:#fff; color:#0a0a0f;
    box-shadow: 0 4px 16px rgba(255,255,255,0.1), 0 1px 4px rgba(0,0,0,0.3);
  }
  .btn-primary:hover {
    background:#f0f4ff;
    transform:translateY(-2px);
    box-shadow: 0 8px 28px rgba(255,255,255,0.15), 0 2px 8px rgba(0,0,0,0.3);
  }

  .btn-danger {
    background:rgba(239,68,68,0.08);
    border:1px solid rgba(239,68,68,0.25);
    color:#f87171; font-size:12px; padding:6px 16px; border-radius:8px;
  }
  .btn-danger:hover {
    background:rgba(239,68,68,0.18);
    border-color:rgba(239,68,68,0.45);
    transform:translateY(-1px);
    box-shadow:0 4px 12px rgba(239,68,68,0.15);
  }

  /* ─── SERIE TOGGLE ────────────────────────────────────── */
  .serie-toggle {
    display:flex; gap:6px; margin-bottom:20px;
    overflow-x:auto; padding-bottom:4px;
    scrollbar-width:none;
  }
  .serie-toggle::-webkit-scrollbar { display:none; }

  .stab {
    padding:7px 16px; border-radius:var(--radius-pill);
    background:transparent; border:1px solid var(--border2);
    color:var(--text-muted); font-family:var(--font);
    font-size:13px; font-weight:600; cursor:pointer;
    transition: all 0.22s cubic-bezier(0.34,1.3,0.64,1);
    white-space:nowrap; flex-shrink:0;
    position:relative; overflow:hidden;
  }
  .stab::before {
    content:'';
    position:absolute; inset:0;
    background:transparent;
    transition:background 0.2s ease;
    border-radius:inherit;
  }
  .stab:hover {
    color:var(--text);
    border-color:rgba(255,255,255,0.18);
    transform:translateY(-1px);
  }
  .stab.active {
    background:rgba(168,85,247,0.11);
    border-color:rgba(168,85,247,0.38);
    color:#c084fc;
    box-shadow: 0 2px 12px rgba(168,85,247,0.12);
    transform:translateY(-1px);
  }
  .stab-icon { margin-right:5px; font-size:14px; }

  /* ─── TABLE ───────────────────────────────────────────── */
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th {
    font-family:var(--mono); font-size:10px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--text-muted);
    padding:10px 14px; text-align:left;
    border-bottom:1px solid var(--border); white-space:nowrap;
  }
  td {
    padding:12px 14px;
    border-bottom:1px solid rgba(255,255,255,0.03);
    font-family:var(--mono); font-size:12px; color:var(--text-mid);
    vertical-align:middle; white-space:nowrap;
    transition:color 0.15s ease, background 0.15s ease;
  }
  tr:last-child td { border-bottom:none; }
  tr { transition:background 0.15s ease; }
  tr:hover td {
    background:rgba(255,255,255,0.025);
    color:var(--text);
  }

  /* Row entrance animation on table load */
  @keyframes rowIn {
    from { opacity:0; transform:translateX(-8px); }
    to   { opacity:1; transform:translateX(0); }
  }

  /* ─── BADGES ──────────────────────────────────────────── */
  .badge {
    display:inline-flex; align-items:center; padding:3px 9px;
    font-size:11px; font-family:var(--mono); font-weight:500;
    border-radius:7px; letter-spacing:0.05em;
    background:rgba(59,130,246,0.1); border:1px solid rgba(59,130,246,0.22); color:#60a5fa;
    transition:all 0.2s ease;
  }
  .badge-num    { background:rgba(168,85,247,0.1); border-color:rgba(168,85,247,0.22); color:#c084fc; }
  .badge-green  { background:rgba(34,197,94,0.1);  border-color:rgba(34,197,94,0.22);  color:#4ade80; }
  .badge-yellow { background:rgba(234,179,8,0.1);  border-color:rgba(234,179,8,0.22);  color:#facc15; }
  .badge-red    { background:rgba(239,68,68,0.1);  border-color:rgba(239,68,68,0.22);  color:#f87171; }
  .badge-muted  { background:rgba(255,255,255,0.04); border-color:rgba(255,255,255,0.08); color:var(--text-muted); }
  .badge-orange { background:rgba(249,115,22,0.1); border-color:rgba(249,115,22,0.22); color:#fb923c; }
  .badge-cyan   { background:rgba(6,182,212,0.1);  border-color:rgba(6,182,212,0.22);  color:#22d3ee; }

  /* ─── EMPTY ───────────────────────────────────────────── */
  .empty-msg {
    font-family:var(--mono); font-size:13px; color:var(--text-muted);
    text-align:center; padding:56px 0;
    border:1px dashed var(--border2); border-radius:var(--radius);
    letter-spacing:0.08em;
    animation:panelIn 0.4s cubic-bezier(0.22,1,0.36,1) both;
  }

  /* ─── TOTAL LINE ──────────────────────────────────────── */
  .total-line {
    font-size:12px; color:var(--text-muted); margin-top:16px;
    text-align:right; font-family:var(--mono); letter-spacing:0.05em;
    display:flex; align-items:center; justify-content:flex-end; gap:8px;
    animation:panelIn 0.5s cubic-bezier(0.22,1,0.36,1) 0.12s both;
  }
  .total-line .chip {
    background:rgba(34,197,94,0.1); border:1px solid rgba(34,197,94,0.22);
    color:var(--accent-green); border-radius:var(--radius-pill);
    padding:2px 12px; font-size:12px;
  }

  /* ─── TOAST ───────────────────────────────────────────── */
  #toast {
    position:fixed; top:24px; right:24px;
    padding:14px 20px; font-family:var(--mono); font-size:13px;
    border-radius:var(--radius-sm); border:1px solid rgba(34,197,94,0.25);
    background:rgba(10,10,18,0.96); backdrop-filter:blur(16px);
    color:var(--accent-green);
    opacity:0; transform:translateX(24px) scale(0.96) translateY(-4px);
    transition: all 0.4s cubic-bezier(0.34,1.3,0.64,1);
    z-index:9900; pointer-events:none; max-width:340px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.04);
  }
  #toast.show { opacity:1; transform:translateX(0) scale(1) translateY(0); }
  #toast.error { border-color:rgba(239,68,68,0.25); color:#f87171; }

  /* ─── FORM FOOTER ─────────────────────────────────────── */
  .form-footer {
    display:flex; justify-content:flex-end;
    margin-top:28px; padding-top:24px; border-top:1px solid var(--border);
  }

  /* ─── RESPONSIVE ──────────────────────────────────────── */
  @media(max-width:900px) {
    .form-grid-3 { grid-template-columns:1fr 1fr; }
    .form-grid-4 { grid-template-columns:1fr 1fr; }
  }
  @media(max-width:560px) {
    .form-grid,.form-grid-3,.form-grid-4 { grid-template-columns:1fr; }
    .form-group.full { grid-column:1; }
    header { padding:36px 0 28px; }
    .card { padding:20px 18px; }
  }
</style>
</head>
<body class="loading">

<div id="page-transition">
  <div class="pt-curtain">
    <div class="pt-stripe"></div>
    <div class="pt-stripe"></div>
    <div class="pt-stripe"></div>
  </div>
</div>

<div id="loader">
  <div class="loader-logo">Ativos Escolares</div>
  <div class="loader-grid">
    <div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div>
    <div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div>
    <div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div>
    <div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div>
    <div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div>
  </div>
  <div class="loader-bar-wrap"><div class="loader-bar"></div></div>
  <div class="loader-label">Carregando sistema</div>
</div>

<header>
  <div class="header-badge">Sistema Operacional</div>
  <h1 class="header-title">Tabela de<br>Ativos Escolares</h1>
  <p class="header-sub">Gerencie equipamentos por turma. Registre, visualize e remova ativos com facilidade.</p>
</header>

<nav id="main-nav">
  <div class="nav-indicator" id="nav-indicator"></div>
  <button class="tab active" onclick="showTab('registrar', this)">Registrar</button>
  <button class="tab"        onclick="showTab('visualizar', this)">Visualizar</button>
  <button class="tab"        onclick="showTab('remover', this)">Remover</button>
</nav>

<div id="panel-registrar" class="panel active">
  <div class="card">
    <div class="section-title">Registrar novo ativo</div>

    <div class="form-section">
      <div class="form-section-label">Identificação da turma</div>
      <div class="form-grid">
        <div class="form-group">
          <label>Categoria / Turma</label>
          <select id="reg-serie">
            <option value="">— Selecione —</option>
            <option value="2A">💻 2º Ano (2A)</option>
            <option value="3A">💻 3º Ano (3A)</option>
            <option value="SETUPS">🖥️ Setups</option>
            <option value="CARRINHOS">🛒 Carrinhos</option>
            <option value="TABLETS">📱 Tablets</option>
            <option value="TELEVISAO">📺 Televisão</option>
          </select>
        </div>
        <div class="form-group">
          <label>Situação</label>
          <select id="reg-situacao">
            <option value="">— Selecione —</option>
            <option value="Em uso">Em uso</option>

        </div>

        </div>
        <div class="form-group">
          <label>Marca</label>
          <select id="reg-marca">
            <option value="">— Selecione —</option>
            <option value="Positivo">Positivo</option>
            <option value="Lenovo">Lenovo</option>
            <option value="LG">LG</option>
            <option value="Philco">Philco</option>
            <option value="Acer">Acer</option>
            <option value="Samsung">Samsung</option>
          </select>
        </div>
        <div class="form-group">
          <label>Modelo</label>
          <select id="reg-modelo">
            <option value="">— Selecione —</option>
            <option value="Master N8440">Master N8440</option>
            <option value="ThinkCentre M75s Gen 1">ThinkCentre M75s Gen 1</option>
            <option value="Positivo Master D5700">Positivo Master D5700</option>
            <option value="Mt 9850-122">Mt 9850-122</option>
            <option value="Positivo Master N1110">Positivo Master N1110</option>
            <option value="Modelo Escolar">Modelo Escolar</option>
            <option value="43UN731COSC.AWZFLJZ">Televisão LG 43</option>
            <option value="Chromebook">Chromebook</option>
            <option value="Aspire 3">Aspire 3</option>
          </select>
        </div>
        <div class="form-group">
          <label>ID do Computador</label>
          <input type="text" id="reg-nb" placeholder="Ex: 07"/>
        </div>
        <div class="form-group">
          <label>ID do Carregador</label>
          <input type="text" id="reg-car" placeholder="Ex: 07"/>
        </div>
        <div class="form-group">
          <label>Mochila</label>
          <select id="reg-mochila">
            <option value="">— Selecione —</option>
            <option value="Sim">Sim</option>
            <option value="Não">Não</option>
          </select>
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-label">Localização e status</div>
      <div class="form-grid">
        <div class="form-group">
          <label>Local</label>
          <select id="reg-local">
            <option value="">— Selecione —</option>
            <option value="Salas de Aula">Salas de Aula</option>
            <option value="Sala Maker">Sala Maker</option>
            <option value="Armário Maker">Armário Maker</option>
          </select>
        </div>
        <div class="form-group">
          <label>Criticidade</label>
          <select id="reg-criticidade">
            <option value="">— Selecione —</option>
            <option value="Nenhuma">Nenhuma</option>
            <option value="Sim">Sim</option>
            <option value="Não">Não</option>
          </select>
        </div>
      </div>
    </div>

    <div class="form-footer">
      <button class="btn btn-primary" onclick="registrar()">Registrar Ativo</button>
    </div>
  </div>
</div>

<div id="panel-visualizar" class="panel">
  <div class="card">
    <div class="section-title">Ativos registrados</div>
    <div class="serie-toggle">
      <button class="stab active" onclick="loadAtivos('2A', this)"><span class="stab-icon">💻</span>2A</button>
      <button class="stab"        onclick="loadAtivos('3A', this)"><span class="stab-icon">💻</span>3A</button>
      <button class="stab"        onclick="loadAtivos('SETUPS', this)"><span class="stab-icon">🖥️</span>Setups</button>
      <button class="stab"        onclick="loadAtivos('CARRINHOS', this)"><span class="stab-icon">🛒</span>Carrinhos</button>
      <button class="stab"        onclick="loadAtivos('TABLETS', this)"><span class="stab-icon">📱</span>Tablets</button>
      <button class="stab"        onclick="loadAtivos('TELEVISAO', this)"><span class="stab-icon">📺</span>Televisão</button>
    </div>
    <div id="table-container"></div>
  </div>
</div>

<div id="panel-remover" class="panel">
  <div class="card">
    <div class="section-title">Remove ativo</div>
    <div class="serie-toggle">
      <button class="stab active" onclick="loadRemover('2A', this)"><span class="stab-icon">💻</span>2A</button>
      <button class="stab"        onclick="loadRemover('3A', this)"><span class="stab-icon">💻</span>3A</button>
      <button class="stab"        onclick="loadRemover('SETUPS', this)"><span class="stab-icon">🖥️</span>Setups</button>
      <button class="stab"        onclick="loadRemover('CARRINHOS', this)"><span class="stab-icon">🛒</span>Carrinhos</button>
      <button class="stab"        onclick="loadRemover('TABLETS', this)"><span class="stab-icon">📱</span>Tablets</button>
      <button class="stab"        onclick="loadRemover('TELEVISAO', this)"><span class="stab-icon">📺</span>Televisão</button>
    </div>
    <div id="remove-container"></div>
  </div>
</div>

<div id="toast"></div>

<script>
  /* ── LOADER ─────────────────────────────────────────── */
  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      const loader = document.getElementById('loader');
      loader.classList.add('hide');
      document.body.classList.remove('loading');
      setTimeout(() => loader.remove(), 750);
      // Init nav indicator
      initNavIndicator();
      // Animate first panel
      document.getElementById('panel-registrar').classList.add('panel-enter');
    }, 1900);
  });

  /* ── NAV INDICATOR (sliding pill) ───────────────────── */
  function initNavIndicator() {
    updateNavIndicator(document.querySelector('.tab.active'));
  }

  function updateNavIndicator(activeTab) {
    const nav = document.getElementById('main-nav');
    const indicator = document.getElementById('nav-indicator');
    if (!activeTab || !nav) return;

    const navRect  = nav.getBoundingClientRect();
    const tabRect  = activeTab.getBoundingClientRect();
    const left     = tabRect.left - navRect.left - 5; // account for padding
    const width    = tabRect.width;

    indicator.style.left  = left + 'px';
    indicator.style.width = width + 'px';
  }

  /* ── PAGE TRANSITION ENGINE ──────────────────────────── */
  let _transitioning = false;

  function pageTransition(callback) {
    if (_transitioning) return;
    _transitioning = true;

    const overlay = document.getElementById('page-transition');

    // Phase 1: drop curtain
    overlay.classList.remove('rising');
    overlay.classList.add('dropping');

    // Phase 2: execute callback + rise curtain after short delay
    const dropDuration = 380; // ms — matches longest CSS transition
    setTimeout(() => {
      callback();

      // Small pause on "held" state
      setTimeout(() => {
        overlay.classList.remove('dropping');
        overlay.classList.add('rising');

        // Clean up after rise completes
        setTimeout(() => {
          overlay.classList.remove('rising');
          _transitioning = false;
        }, 500);
      }, 60);
    }, dropDuration + 40);
  }

  /* ── SHOW TAB ────────────────────────────────────────── */
  // CORRIGIDO: Inicializa com '2A' ao invés de '2'
  let vizSerie = "2A", remSerie = "2A";

  const LABELS = {
    "2A":"2º Ano (2A)", "3A":"3º Ano (3A)",
    "SETUPS":"Setups", "CARRINHOS":"Carrinhos",
    "TABLETS":"Tablets", "TELEVISAO":"Televisão"
  };

  function showTab(name, el) {
    const currentPanel = document.querySelector('.panel.active');
    if (currentPanel && currentPanel.id === 'panel-' + name) return;

    pageTransition(() => {
      // Update tabs
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      updateNavIndicator(el);

      // Swap panels
      document.querySelectorAll('.panel').forEach(p => {
        p.classList.remove('active', 'panel-enter');
      });

      const next = document.getElementById('panel-' + name);
      next.classList.add('active');

      // Trigger stagger after paint
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          next.classList.add('panel-enter');
        });
      });

      if (name === 'visualizar') loadAtivos(vizSerie);
      if (name === 'remover')    loadRemover(remSerie);
    });
  }

  /* ── TOAST ───────────────────────────────────────────── */
  function toast(msg, err = false) {
    const el = document.getElementById('toast');
    el.textContent = (err ? '✕  ' : '✓  ') + msg;
    el.className = 'show' + (err ? ' error' : '');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.className = '', 3200);
  }

  /* ── BADGES ──────────────────────────────────────────── */
  function badgeSituacao(val) {
    if (val === 'Em uso')     return `<span class="badge badge-green">${val}</span>`;
    if (val === 'Não em uso') return `<span class="badge badge-red">${val}</span>`;
    return `<span class="badge badge-muted">${val || '—'}</span>`;
  }
  function badgeSim(val) {
    if (val === 'Sim') return `<span class="badge badge-yellow">${val}</span>`;
    if (val === 'Não') return `<span class="badge badge-muted">${val}</span>`;
    return `<span class="badge badge-muted">${val || '—'}</span>`;
  }
  function badgeTipo(val) {
    const map = {'Notebook':'badge-cyan','Tablet':'badge-orange','Setup':'badge','Televisão':'badge-muted'};
    return `<span class="badge ${map[val]||''}">${val||'—'}</span>`;
  }

  /* ── BUILD TABLE ─────────────────────────────────────── */
  function buildTable(ativos, serie, withRemove = false) {
    if (!ativos || !ativos.length) {
      return `<div class="empty-msg">Nenhum ativo registrado em ${LABELS[serie]||serie}</div>`;
    }
    const label = LABELS[serie] || serie;
    const removeCol = withRemove ? '<th></th>' : '';

    // Animate rows with staggered delay
    const rows = ativos.map((a, i) => {
      const removeBtn = withRemove
        ? `<td><button class="btn btn-danger" onclick="remover('${serie}', ${a.id})">Remover</button></td>`
        : '';
      return `<tr style="animation:rowIn 0.35s cubic-bezier(0.22,1,0.36,1) ${0.03 + i * 0.03}s both">
        <td><span class="badge badge-num">${String(i + 1).padStart(2,'0')}</span></td>
        <td>${a.owner_1 || '—'}</td>
        <td>${a.owner_2 || '—'}</td>
        <td>${badgeTipo(a.tipo)}</td>
        <td>${a.marca || '—'}</td>
        <td>${a.modelo || '—'}</td>
        <td>${a.local || '—'}</td>
        <td><span class="badge">${a.id_computer || '—'}</span></td>
        <td><span class="badge">${a.id_carregator || '—'}</span></td>
        <td>${badgeSituacao(a.situacao)}</td>
        <td>${badgeSim(a.mochila)}</td>
        <td>${badgeSim(a.criticidade)}</td>
        ${removeBtn}
      </tr>`;
    }).join('');

    return `
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Nº</th><th>Resp. 1</th><th>Resp. 2</th><th>Tipo</th>
            <th>Marca</th><th>Modelo</th><th>Local</th>
            <th>ID Equip.</th><th>Carregador</th>
            <th>Situação</th><th>Mochila</th><th>Criticidade</th>
            ${removeCol}
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="total-line">
        Total em ${label}
        <span class="chip">${ativos.length} ativo${ativos.length !== 1 ? 's' : ''}</span>
      </div>`;
  }

  /* ── LOAD / REMOVER / REGISTRAR ──────────────────────── */
  async function loadAtivos(serie, btn) {
    vizSerie = serie;
    if (btn) {
      document.querySelectorAll('#panel-visualizar .stab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
    const res  = await fetch('/api/visualizar/' + serie);
    const data = await res.json();
    
    // CORRIGIDO: O app.py retorna uma lista direta em formato JSON (ex: [ { ... }, { ... } ])
    // ao invés de um objeto envelopado com .ativos, tratamos os dados aqui de forma limpa.
    const listaAtivos = Array.isArray(data) ? data : (data.ativos || []);

    const container = document.getElementById('table-container');
    // Fade out old content
    container.style.opacity = '0';
    container.style.transform = 'translateY(6px)';
    container.style.transition = 'opacity 0.18s ease, transform 0.18s ease';
    setTimeout(() => {
      container.innerHTML = buildTable(listaAtivos, serie, false);
      container.style.opacity = '1';
      container.style.transform = 'translateY(0)';
    }, 180);
  }

  async function loadRemover(serie, btn) {
    remSerie = serie;
    if (btn) {
      document.querySelectorAll('#panel-remover .stab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
    const res  = await fetch('/api/visualizar/' + serie);
    const data = await res.json();
    
    // CORRIGIDO: Mesmo tratamento seguro para a lista da rota de remoção
    const listaAtivos = Array.isArray(data) ? data : (data.ativos || []);

    const container = document.getElementById('remove-container');
    container.style.opacity = '0';
    container.style.transform = 'translateY(6px)';
    container.style.transition = 'opacity 0.18s ease, transform 0.18s ease';
    setTimeout(() => {
      container.innerHTML = buildTable(listaAtivos, serie, true);
      container.style.opacity = '1';
      container.style.transform = 'translateY(0)';
    }, 180);
  }

  async function registrar() {
    const campos = ['reg-serie','reg-owner1','reg-owner2','reg-nb','reg-car','reg-tipo','reg-marca','reg-modelo','reg-local','reg-situacao','reg-mochila','reg-criticidade'];
    const vals = {};
    for (const id of campos) vals[id] = document.getElementById(id).value.trim();
    const obrigatorios = campos.filter(id => id !== 'reg-owner2');
    if (obrigatorios.some(id => !vals[id])) return toast('Preencha todos os campos.', true);
    const payload = {
      serie_id: vals['reg-serie'], owner_1: vals['reg-owner1'], owner_2: vals['reg-owner2'],
      id_computer: vals['reg-nb'], id_carregator: vals['reg-car'],
      tipo: vals['reg-tipo'], marca: vals['reg-marca'], modelo: vals['reg-modelo'],
      local: vals['reg-local'], situacao: vals['reg-situacao'],
      mochila: vals['reg-mochila'], criticidade: vals['reg-criticidade'],
    };
    const res  = await fetch('/api/registrar', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
    const data = await res.json();
    toast(data.msg, !data.ok);
    if (data.ok) campos.forEach(id => { document.getElementById(id).value = ''; });
  }

  async function remover(serie, id) {
    if (!confirm('Confirmar remoção do ativo?')) return;
    const res  = await fetch(`/api/remover/${serie}/${id}`, { method:'DELETE' });
    const data = await res.json();
    toast(data.msg, !data.ok);
    if (data.ok) loadRemover(serie);
  }
</script>
</body>
