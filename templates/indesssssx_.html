<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tabela de Ativos</title>
<style>
body { background:#0a0a0f; color:#fff; font-family:Arial; padding:40px; }
h1 { margin-bottom:20px; }
table { width:100%; border-collapse:collapse; background:#111; }
th, td { padding:10px; border:1px solid #222; text-align:left; }
th { background:#1a1a1a; }
button { padding:6px 12px; cursor:pointer; }
</style>
</head>

<body>

<h1>📊 Sistema de Equipamentos</h1>

<h2>➕ Registrar</h2>
<input id="tipo" placeholder="Tipo">
<input id="marca" placeholder="Marca">
<input id="modelo" placeholder="Modelo">
<input id="local" placeholder="Local">
<input id="usuario" placeholder="Usuário">
<input id="situacao" placeholder="Situação">
<input id="criticidade" placeholder="Criticidade">
<button onclick="registrar()">Salvar</button>

<h2>📋 Visualizar</h2>
<div id="table-container">Carregando...</div>

<h2>❌ Remover</h2>
<div id="remove-container"></div>

<script>
async function registrar() {
  const payload = {
    tipo: document.getElementById('tipo').value,
    marca: document.getElementById('marca').value,
    modelo: document.getElementById('modelo').value,
    localizacao: document.getElementById('local').value,
    usuario: document.getElementById('usuario').value,
    situacao: document.getElementById('situacao').value,
    criticidade: document.getElementById('criticidade').value
  };

  await fetch('/api/adicionar', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload)
  });

  alert("Salvo!");
  loadAtivos();
}

async function loadAtivos() {
  const res = await fetch('/api/equipamentos');
  const data = await res.json();

  const table = `
    <table>
      <tr>
        <th>ID</th><th>Tipo</th><th>Marca</th><th>Modelo</th>
        <th>Local</th><th>Usuário</th><th>Situação</th><th>Criticidade</th>
      </tr>
      ${data.map(e => `
        <tr>
          <td>${e.id}</td>
          <td>${e.tipo}</td>
          <td>${e.marca}</td>
          <td>${e.modelo}</td>
          <td>${e.localizacao}</td>
          <td>${e.usuario}</td>
          <td>${e.situacao}</td>
          <td>${e.criticidade}</td>
        </tr>
      `).join('')}
    </table>
  `;

  document.getElementById("table-container").innerHTML = table;
  loadRemover();
}

async function loadRemover() {
  const res = await fetch('/api/equipamentos');
  const data = await res.json();

  const table = `
    <table>
      <tr><th>ID</th><th>Tipo</th><th>Ação</th></tr>
      ${data.map(e => `
        <tr>
          <td>${e.id}</td>
          <td>${e.tipo}</td>
          <td><button onclick="remover(${e.id})">Remover</button></td>
        </tr>
      `).join('')}
    </table>
  `;

  document.getElementById("remove-container").innerHTML = table;
}

async function remover(id) {
  await fetch('/api/remover/' + id, { method:'DELETE' });
  loadAtivos();
}

loadAtivos();
</script>

</body>
</html>
